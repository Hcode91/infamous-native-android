name: Godot APK

# Builds the Godot version: the engine readers as a GDExtension for arm64, then the APK.
# No game files are used or bundled; the app reads them from the phone at run time.

on:
  push:
    paths: ["godot/**", "engine/**", ".github/workflows/godot.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1
  GODOT_CPP_TAG: godot-4.5-stable

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build nasm

      - name: godot-cpp
        run: git clone --depth 1 --branch "$GODOT_CPP_TAG" https://github.com/godotengine/godot-cpp "$RUNNER_TEMP/godot-cpp"

      - name: FFmpeg (Bink only, arm64)
        run: |
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg "$RUNNER_TEMP/ffmpeg"
          godot/extension/build_ffmpeg.sh "$RUNNER_TEMP/ffmpeg" "$RUNNER_TEMP/ffbuild" "$RUNNER_TEMP/ffinst" android "$ANDROID_NDK_LATEST_HOME"

      - name: Plugin (arm64)
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          cmake -S godot/extension -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DGODOT_CPP_DIR="$RUNNER_TEMP/godot-cpp" -DFFMPEG_DIR="$RUNNER_TEMP/ffinst"
          ninja -C build-android
          ls -la godot/project/bin

      - name: Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          cd "$RUNNER_TEMP"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -fsSL -o tpz.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpz.tpz "templates/android_debug.apk" "templates/version.txt"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && mv templates/* "$dest/" && rm tpz.tpz godot.zip

      - name: Export
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
          cd godot/project && mkdir -p export
          "$RUNNER_TEMP/godot" --headless --import || true
          "$RUNNER_TEMP/godot" --headless --export-debug "Android" export/ina-godot.apk
          ls -la export

      - uses: actions/upload-artifact@v4
        with:
          name: ina-godot-apk
          path: godot/project/export/ina-godot.apk
